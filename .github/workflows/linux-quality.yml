# Test-quality measurement for the Linux workspace.
#
# Deliberately NOT wired to push or pull_request. These jobs measure how
# good the tests are rather than whether the code is correct, they take
# tens of minutes, and a number moving in the wrong direction is a
# discussion rather than a build failure. Run them on a schedule and read
# the artifacts.
name: Linux test quality

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag or branch to measure."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: linux-quality-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing (core, policy)
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || 'linux' }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsecret-1-dev libkrb5-dev clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-mutants
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version ^27
      # `core` and `policy` are pure logic with no GTK and no driver, so a
      # surviving mutant there means a behaviour no test pins rather than
      # an environment the runner lacks. They are also the two crates
      # whose defects reach SQL and authorization decisions.
      - name: Mutate tablepro-core
        run: |
          cargo mutants --package tablepro-core --test-tool cargo \
            --output mutants-core --timeout 60 --no-shuffle -- --lib || true
      - name: Mutate tablepro-policy
        run: |
          cargo mutants --package tablepro-policy --test-tool cargo \
            --output mutants-policy --timeout 60 --no-shuffle -- --lib || true
      - name: Summarise surviving mutants
        if: always()
        run: |
          {
            echo "### Surviving mutants"
            echo
            echo "A surviving mutant is a change to the code that no test noticed."
            echo "Some are equivalent to the original and can never be caught; the"
            echo "rest are behaviour with no test behind it."
            for crate in core policy; do
              caught="mutants-$crate/caught.txt"
              missed="mutants-$crate/missed.txt"
              timeout="mutants-$crate/timeout.txt"
              echo
              echo "#### tablepro-$crate"
              echo
              printf 'caught: %s, missed: %s, timeout: %s\n' \
                "$(wc -l <"$caught" 2>/dev/null || echo 0)" \
                "$(wc -l <"$missed" 2>/dev/null || echo 0)" \
                "$(wc -l <"$timeout" 2>/dev/null || echo 0)"
              if [[ -s "$missed" ]]; then
                echo
                echo '```'
                cat "$missed"
                echo '```'
              fi
            done
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mutants-${{ github.run_id }}
          path: |
            linux/mutants-core
            linux/mutants-policy
          if-no-files-found: warn

  coverage:
    name: Coverage (non-GTK crates)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || 'linux' }}
      - name: Record the commit under test
        run: |
          echo "tree under test: $(git rev-parse HEAD)"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsecret-1-dev libkrb5-dev clang
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: linux
          prefix-key: linux-coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # The unit and sandbox tiers only. Driver, TLS, release and GTK
      # tiers need Docker, a network fixture or a display, so including
      # them would make the number depend on the runner rather than on
      # the tests.
      - name: Measure
        run: |
          cargo llvm-cov --no-report --workspace \
            --exclude tablepro-driver-duckdb --exclude tablepro-app \
            --lib --bins --tests
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage.txt
      - name: Publish the summary
        if: always()
        run: |
          {
            echo "### Coverage, unit and sandbox tiers"
            echo
            echo "Excludes the GTK app crate, and the driver, TLS, release and"
            echo "installed-GTK tiers, which need Docker or a display."
            echo
            echo '```'
            cat coverage.txt || echo "no report produced"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: coverage-${{ github.run_id }}
          path: linux/lcov.info
          if-no-files-found: warn
