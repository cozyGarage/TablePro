name: tablepro-driver-tls

services:
  mongo:
    build:
      context: .
      dockerfile: mongo/Dockerfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: tablepro
      MONGO_INITDB_ROOT_PASSWORD: tablepro
      MONGO_INITDB_DATABASE: tablepro
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    command:
      - mongod
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /certs/server.pem
      - --tlsCAFile
      - /certs/ca.crt
      - --tlsAllowConnectionsWithoutCertificates
      - --bind_ip_all
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --tls
        - --tlsCAFile
        - /certs/ca.crt
        - --host
        - localhost
        - -u
        - tablepro
        - -p
        - tablepro
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping')"
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - "127.0.0.1:27018:27017"
    networks:
      fixture:
        aliases:
          - mongo.tablepro.test

networks:
  fixture:
    driver: bridge
