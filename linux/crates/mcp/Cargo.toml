[package]
name = "tablepro-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "tablepro_mcp"
path = "src/lib.rs"

[dependencies]
tablepro-core = { path = "../core" }
tablepro-policy = { path = "../policy" }
tablepro-storage = { path = "../storage" }
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "io-std"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
libc.workspace = true
secrecy.workspace = true
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile.workspace = true
